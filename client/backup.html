<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1565c0" />
  <title>دفتر حساب</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <!-- ============ OFFLINE: a file on the device ============================ -->
    <div class="section-title"><span data-i18n="bak.offline">نسخة على الجهاز (ملف)</span></div>
    <div class="card">
      <p class="muted" style="margin:0 0 10px" data-i18n="bak.offlineHint">
        نزّل الدفتر كملف JSON على جهازك أو على ذكر USB — يرجع بدون إنترنت.
      </p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn secondary" id="btn-export" type="button" data-i18n="bak.export">نزّل نسخة (ملف)</button>
        <button class="btn ghost" id="btn-pick-file" type="button" data-i18n="bak.pickFile">اختر ملف نسخة</button>
        <input type="file" id="bak-file" accept="application/json,.json" hidden />
      </div>
      <p class="muted" id="file-name" style="margin:10px 0 0"></p>

      <div id="import-box" hidden>
        <div class="section-title" style="margin:14px 0 6px"><span data-i18n="bak.mode">كيف ترجّع؟</span></div>
        <label class="radio-row">
          <input type="radio" name="mode" value="merge" checked />
          <span><b data-i18n="bak.merge">ادمج مع الحالي</b><br><em class="muted" data-i18n="bak.mergeHint">يضيف اللي ناقص بس، بدون تكرار.</em></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="mode" value="replace" />
          <span><b data-i18n="bak.replace">استبدل كل شي</b><br><em class="muted" data-i18n="bak.replaceHint">بيتمسح دفتري الحالي وترجع النسخة.</em></span>
        </label>
        <label class="check-row">
          <input type="checkbox" class="bak-confirm tick" />
          <span data-i18n="bak.confirm">افهم إني بامسح دفتري الحالي</span>
        </label>
        <em class="err-text bak-err" id="import-err"></em>
        <button class="btn danger" id="btn-import" type="button" data-i18n="bak.importBtn">ارجع النسخة</button>
      </div>
    </div>

    <!-- ============ ONLINE: copies kept on the server ======================== -->
    <div class="section-title">
      <span data-i18n="bak.online">نسخ على السيرفر</span>
      <button class="btn sm secondary" id="btn-save-online" type="button" data-i18n="bak.save">خزّن نسخة</button>
    </div>
    <div class="card">
      <p class="muted" style="margin:0 0 10px" data-i18n="bak.onlineHint">
        السيرفر بيحتفظ بآخر 10 نسخ. ترجع منها من أي جهاز برقم موبايلك.
      </p>
      <div id="online-list" class="list-plain"></div>
      <p class="muted" id="online-empty" data-i18n="bak.noCopies" hidden>لا نسخ على السيرفر لسه.</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/jalali.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/autobackup.js"></script>
  <script src="js/backup.js"></script>
</body>
</html>
