<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <!-- empty-checks.svg — a blank cheque, waiting to be written. -->
  <ellipse cx="100" cy="142" rx="66" ry="6" fill="#ECEEF1"/>

  <rect x="26" y="46" width="148" height="66" rx="12" fill="#FFFFFF" stroke="#0F3D63" stroke-width="3.5"/>
  <rect x="36" y="56" width="128" height="46" rx="8" stroke="#2196F3" stroke-width="3" stroke-dasharray="7 7" opacity=".6"/>

  <!-- the amount box and the signature line -->
  <rect x="112" y="64" width="44" height="20" rx="6" fill="#E3F2FD"/>
  <path d="M46 96c6-8 10 6 16-2s8 4 14-2" stroke="#0F3D63" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M46 104h64" stroke="#ECEEF1" stroke-width="3.5" stroke-linecap="round"/>

  <!-- a coin resting on the corner -->
  <circle cx="152" cy="106" r="17" fill="#E3F2FD" stroke="#2196F3" stroke-width="3.5"/>
  <path d="M152 99v14M148 106h8" stroke="#2196F3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="34" r="5" fill="#E91E63" opacity=".85"/>
</svg>
