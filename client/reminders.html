<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f3f6" />
  <title>دفتر حساب</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <!-- Three segments, exactly like the reference app's bell screen. They are
         not three different tables: the first is the reminders you wrote, the
         other two are due dates the ledger already knows about (the next
         installment of every loan, the maturity of every open check). -->
    <div class="seg" id="seg" role="tablist">
      <button type="button" role="tab" class="active" data-seg="party">
        <span class="ico-slot" data-ico="users"></span><span data-i18n="nav.parties">الأطراف</span></button>
      <button type="button" role="tab" data-seg="loan">
        <span class="ico-slot" data-ico="wallet"></span><span data-i18n="nav.loans">القروض</span></button>
      <button type="button" role="tab" data-seg="check">
        <span class="ico-slot" data-ico="checkbook"></span><span data-i18n="nav.checks">الصكوك</span></button>
    </div>

    <div id="list" class="stack"></div>

    <div id="empty" class="empty-art" hidden>
      <img src="img/empty-reminders.svg" alt="" />
      <!-- no data-i18n here: the line names the ACTIVE segment, reminders-page.js
           writes it after every render. -->
      <div class="t" id="empty-text">لا تذكيرات لسه.</div>
    </div>
  </main>

  <button class="pill-fab teal" id="fab" type="button">
    <span class="ico-slot" data-ico="plus-circle" data-size="lg"></span>
    <span data-i18n="rem.add">أضف تذكير</span>
  </button>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/jalali.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/autobackup.js"></script>
  <script src="js/party-select.js"></script>
  <script src="js/rem-form.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/reminders-page.js"></script>
</body>
</html>
