<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1565c0" />
  <title>دفتر حساب</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ============ THE CODE PAD (Phase 9: free, not a paid upgrade) ============ -->
  <!-- Same frame the login screen uses: no header, no bottom bar — the door is
       the whole screen. Everything on it is painted by js/lock.js so a language
       flip re-writes the digits the way that language reads them. -->
  <div class="auth-wrap">
    <div class="brand">
      <div class="logo"><span class="ico-slot" data-ico="lock"></span></div>
      <h2 data-i18n="app.name">دفتر حساب</h2>
      <p data-i18n="lock.sub">دفترك مقفل برمز دخول</p>
    </div>

    <div class="card">
      <div class="field-title"><span data-i18n="lock.enter">أدخل رمز الدخول</span></div>

      <!-- One dot per digit typed. aria-hidden: the code is read aloud nowhere. -->
      <div class="pin-dots" id="dots" aria-hidden="true"></div>
      <p class="err-text center" id="pin-err" role="status" aria-live="polite"></p>

      <!-- The pad is painted in JS (the digits follow the language), and so is its
           label — a static aria-label here would be Arabic on a Persian screen. -->
      <div class="keypad" id="keypad" role="group"></div>

      <div class="row" style="gap:8px;margin-top:14px">
        <button class="btn ghost grow" type="button" id="btn-clear" data-i18n="lock.clear">امسح</button>
        <button class="btn grow" type="button" id="btn-ok" data-i18n="lock.open">افتح</button>
      </div>

      <p class="muted center" style="margin:12px 0 0" data-i18n="lock.hint">
        الرمز تضعه أنت من الإعدادات — ونسياه يرجع بكلمة مرور حسابك.
      </p>

      <div class="seg on-white" id="lang-row" style="margin-top:14px">
        <button type="button" data-lang="ar">العربية</button>
        <button type="button" data-lang="fa">فارسی</button>
      </div>

      <button class="btn secondary" type="button" id="btn-other" style="margin-top:10px"
              data-i18n="lock.other">دخول بحساب آخر</button>
    </div>
  </div>

  <!-- No UI.shell() here, so the toast host has to be written out. -->
  <div class="toast-host"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/jalali.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lock.js"></script>
</body>
</html>
